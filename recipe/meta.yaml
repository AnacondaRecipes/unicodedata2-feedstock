{% set name = "unicodedata2" %}
{% set version = "17.0.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d79943d153f5f6bfbe3f55a5ec611985184bda37fcedb3ecc75322d82ae6ad3b

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  requires:
    - pip
    - pytest
  source_files:
    - tests
  imports:
    - unicodedata2
  commands:
    - pip check
    - pytest -v tests

about:
  home: https://github.com/fonttools/unicodedata2
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  summary: unicodedata backport/updates to python 3 and python 2.
  description: unicodedata backport/updates to python 3 and python 2.
  dev_url: https://github.com/fonttools/unicodedata2
  doc_url: https://docs.python.org/3/library/unicodedata.html

extra:
  recipe-maintainers:
    - CJ-Wright
    - dopplershift
